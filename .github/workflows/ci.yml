name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build and test only need to read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        # Live-network tests are opt-in via env vars, so they stay skipped here.
        run: swift test
